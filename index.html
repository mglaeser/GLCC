<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>G.L. Capital & Consulting</title>
  <meta name="description" content="G.L. Capital & Consulting — selected coverage of artificial intelligence, entrepreneurship and brighter AI.">
  <link id="dynamic-favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    body {
      position: relative;
      height: auto;
      min-height: 100%;
    }

    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 4vh, 40px);
      min-height: 100vh;
      min-height: 100svh;
      padding: 48px 24px 72px;
      box-sizing: border-box;
    }

    .logo {
      width: min(300px, 70vw);
      height: min(300px, 70vw);
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .press {
      width: min(100%, 680px);
      text-align: center;
    }

    .press[hidden] { display: none; }

    .press-items {
      display: grid;
      align-items: start;
    }

    .press-item {
      grid-area: 1 / 1;
      margin: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 1s ease, visibility 0s linear 1s;
    }

    .press-item.is-current {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transition-delay: 0s;
    }

    .press-title {
      margin: 0;
      font-family: "Iowan Old Style", "Baskerville", "Palatino Linotype", Georgia, serif;
      font-size: clamp(21px, 2.5vw, 29px);
      font-weight: 400;
      line-height: 1.4;
      letter-spacing: -0.025em;
      text-wrap: balance;
    }

    .press-source {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 17px;
      margin-top: 23px;
      padding: 3px 6px;
      color: #555555;
      font-size: 11px;
      line-height: 1.5;
      letter-spacing: 0.09em;
      text-decoration: none;
    }

    .press-source:hover { color: #000000; }
    .press-source:hover > span:first-child { text-decoration: underline; text-underline-offset: 4px; }
    .press-source:focus-visible { outline: 1px solid currentColor; outline-offset: 6px; }

    .source-logos {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      min-height: 27px;
      color: #111111;
    }

    .source-logos svg { width: 27px; height: 27px; }
    .source-logos .brand-business-insider { width: 128px; }
    .source-logos .brand-washington-post { width: 146px; }
    .source-logos .brand-axel-springer { width: 112px; }
    .brand-definitions { position: absolute; width: 0; height: 0; overflow: hidden; }

    @media (prefers-reduced-motion: reduce) {
      .press-item { transition: none; }
    }

    @media (max-height: 620px) {
      .center { gap: 16px; padding-top: 24px; }
      .logo { width: min(220px, 45vw); height: min(220px, 45vw); }
    }

    .footer-canvas-wrap {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 30px;
      pointer-events: none;
    }

    #footerCanvas {
      display: block;
      width: 100%;
      height: 30px;
    }

    @media (max-width: 420px) {
      .footer-canvas-wrap,
      #footerCanvas {
        height: 28px;
      }
    }
  </style>
</head>

  <div class="footer-canvas-wrap">
    <canvas id="footerCanvas"></canvas>
  </div>

  <script>
    (function () {

      function setSvgFavicon() {
        const svg = document.querySelector(".logo svg");
        if (!svg) return;
      
        const clone = svg.cloneNode(true);
        // Keep the small favicon as the original, legible monogram.
        clone.querySelector(".logo-tagline")?.remove();
        clone.removeAttribute("role");
        clone.removeAttribute("aria-hidden");
        clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      
        const serialized = new XMLSerializer().serializeToString(clone);
        const faviconHref = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(serialized);
      
        let link = document.getElementById("dynamic-favicon");
        if (!link) {
          link = document.createElement("link");
          link.id = "dynamic-favicon";
          link.rel = "icon";
          link.type = "image/svg+xml";
          document.head.appendChild(link);
        }
      
        link.href = faviconHref;
      }
      const encoded = "Ry5MLiBDYXBpdGFsICYgQ29uc3VsdGluZyBVRyB8IEzDvGNrc3RyLiAyNCB8IDEwMzE3IEJlcmxpbiB8IEdmLiBNYXJpYW4gS2xlZSB8IGNvbnRhY3RAZ2xjYy5iZXJsaW4=";

      function fitCanvasToCSS(canvas) {
        const dpr = Math.max(window.devicePixelRatio || 1, 1);
        const rect = canvas.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        const ctx = canvas.getContext("2d");
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        return ctx;
      }

      function decodeBase64Unicode(str) {
        return decodeURIComponent(
          Array.prototype.map.call(atob(str), function (c) {
            return "%" + c.charCodeAt(0).toString(16).padStart(2, "0");
          }).join("")
        );
      }

      function drawFooter() {
        const canvas = document.getElementById("footerCanvas");
        const ctx = fitCanvasToCSS(canvas);
        const w = canvas.getBoundingClientRect().width;
        const h = canvas.getBoundingClientRect().height;
        const text = decodeBase64Unicode(encoded);

        ctx.clearRect(0, 0, w, h);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#b8b8b8";
        ctx.font = (window.innerWidth <= 420 ? 9 : 10) + 'px -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif';
        ctx.fillText(text, w / 2, h / 2, w - 16);
      }

      window.addEventListener("resize", drawFooter, { passive: true });
      setSvgFavicon();
      drawFooter();

      async function loadArticles() {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch("articles.json", { signal: controller.signal, cache: "no-cache" });
          if (!response.ok) return;
          const data = await response.json();
          if (!Array.isArray(data)) return;
          const articles = data.filter(article => {
            if (!article || typeof article.title !== "string" || !article.title.trim() ||
                typeof article.source !== "string" || !article.source.trim() || typeof article.link !== "string") return false;
            try { return new URL(article.link).protocol === "https:"; } catch { return false; }
          });
          if (articles.length) startArticles(articles);
        } catch {
          // The original monogram and company details remain if the data is unavailable.
        } finally {
          clearTimeout(timeout);
        }
      }

      function startArticles(articles) {
        const section = document.querySelector(".press");
        const container = section.querySelector(".press-items");
        const svgNS = "http://www.w3.org/2000/svg";
        const items = articles.map(article => {
          const figure = document.createElement("figure");
          figure.className = "press-item";
          figure.inert = true;
          figure.setAttribute("aria-hidden", "true");
          const title = document.createElement("blockquote");
          title.className = "press-title";
          title.textContent = article.title;
          const caption = document.createElement("figcaption");
          const source = document.createElement("a");
          source.className = "press-source";
          source.href = article.link;
          source.target = "_blank";
          source.rel = "noopener noreferrer";
          source.tabIndex = -1;
          source.setAttribute("aria-label", article.source);
          const marks = document.createElement("span");
          marks.className = "source-logos";
          marks.setAttribute("aria-hidden", "true");
          for (const id of Array.isArray(article.logos) ? article.logos : []) {
            if (typeof id !== "string" || !/^[a-z-]+$/.test(id) || !document.getElementById("brand-" + id)) continue;
            const svg = document.createElementNS(svgNS, "svg");
            svg.setAttribute("class", "brand-" + id);
            svg.setAttribute("focusable", "false");
            const use = document.createElementNS(svgNS, "use");
            use.setAttribute("href", "#brand-" + id);
            svg.append(use);
            marks.append(svg);
          }
          if (article.sourceInLogo !== true || !marks.childElementCount) {
            const name = document.createElement("span");
            name.textContent = article.source;
            source.append(name);
          }
          if (marks.childElementCount) source.append(marks);
          caption.append(source);
          figure.append(title, caption);
          container.append(figure);
          return figure;
        });
        const motion = window.matchMedia("(prefers-reduced-motion: reduce)");
        const holdMs = 2500;
        let current = 0;
        let phase = "enter";
        let timer;
        let deadline = 0;
        let remaining = motion.matches ? 0 : 1000;
        const paused = () => document.hidden || section.contains(document.activeElement);
        const reveal = (item, visible) => {
          item.classList.toggle("is-current", visible);
          item.inert = !visible;
          item.setAttribute("aria-hidden", String(!visible));
          item.querySelector("a").tabIndex = visible ? 0 : -1;
        };
        function schedule() {
          if (items.length < 2 || paused()) return;
          deadline = performance.now() + remaining;
          timer = setTimeout(advance, remaining);
        }
        function advance() {
          timer = undefined;
          if (phase === "enter") {
            phase = "hold";
            remaining = holdMs;
          } else if (phase === "hold") {
            reveal(items[current], false);
            phase = "exit";
            remaining = motion.matches ? 0 : 1000;
          } else {
            current = (current + 1) % items.length;
            reveal(items[current], true);
            phase = "enter";
            remaining = motion.matches ? 0 : 1000;
          }
          schedule();
        }
        function updatePause() {
          if (timer !== undefined) {
            clearTimeout(timer);
            timer = undefined;
            remaining = Math.max(0, deadline - performance.now());
          }
          if (paused() && phase === "exit") {
            reveal(items[current], true);
            phase = "hold";
            remaining = holdMs;
          }
          schedule();
        }
        section.addEventListener("focusin", updatePause);
        section.addEventListener("focusout", () => queueMicrotask(updatePause));
        document.addEventListener("visibilitychange", updatePause);
        motion.addEventListener("change", () => {
          if (phase !== "hold") remaining = motion.matches ? 0 : 1000;
          if (timer !== undefined) clearTimeout(timer);
          timer = undefined;
          schedule();
        });
        section.hidden = false;
        // Establish the hidden styles before the first fade-in.
        void container.offsetWidth;
        reveal(items[current], true);
        schedule();
      }

      loadArticles();
    })();
  </script>
